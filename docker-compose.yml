services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fondrum
      POSTGRES_USER: fondrum
      POSTGRES_PASSWORD: fondrum
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U fondrum -d fondrum" ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
